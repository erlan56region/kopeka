# Публикация маркетплейса «Копейкино» на GitHub Pages.
# Pages отдаёт только статику, поэтому сайт собирается в pages/ скриптом build_pages.py:
#   • CSS/JS встраиваются в один index.html, фото демо-объявлений — в pages/seed/;
#   • данные (объявления, чат, сделки) хранятся в localStorage браузера;
#   • 404.html позволяет открывать прямые ссылки вида /kopeka/ad/<id>.
# Версия с общим сервером и настоящей перепиской между людьми — `npm start`.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Собрать статическую версию
        run: python3 build_pages.py

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pages'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
